name: implement-specialized-config
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/implement-specialized-config.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old="""function CaseView({job,briefing,tab,setTab}:{job:Job,briefing:Briefing|null,tab:string,setTab:(s:string)=>void}){\n const [chat,setChat]=useState<ChatMsg[]>([]); const [input,setInput]=useState(''); const [sending,setSending]=useState(false); const [spec,setSpec]=useState<any>(null); const [specLoading,setSpecLoading]=useState(false)\n const result=job.resultado||{}; const parts=briefing?.partes || result.partes || []; const timeline=briefing?.linhaDoTempo || result.cronologia || []; const alerts=briefing?.pontosAtencao || result.inconsistencias || []; const evidence=briefing?.evidencias || result.gruposEvidencia || []\n async function send(){"""
          new="""function CaseView({job,briefing,tab,setTab}:{job:Job,briefing:Briefing|null,tab:string,setTab:(s:string)=>void}){\n const [chat,setChat]=useState<ChatMsg[]>([]); const [input,setInput]=useState(''); const [sending,setSending]=useState(false); const [spec,setSpec]=useState<any>(null); const [specLoading,setSpecLoading]=useState(false); const [specConfigOpen,setSpecConfigOpen]=useState(false)\n const [specConfig,setSpecConfig]=useState({parteRepresentada:'',contextoAdicional:'',pesquisaJuridica:false,consultaPesquisa:'',forcarProcesso:false,forcarContrato:false,rascunhos:[] as string[]})\n const result=job.resultado||{}; const parts=briefing?.partes || result.partes || []; const timeline=briefing?.linhaDoTempo || result.cronologia || []; const alerts=briefing?.pontosAtencao || result.inconsistencias || []; const evidence=briefing?.evidencias || result.gruposEvidencia || []\n async function send(){"""
          if old not in s: raise SystemExit('CaseView anchor not found')
          s=s.replace(old,new,1)
          old2=""" async function specialized(){setSpecLoading(true);try{const j=await startSpecialized(job.id,{pesquisaJuridica:false});let r=await getSpecialized(j.id);while(!['CONCLUIDO','ERRO'].includes(r.status)){await new Promise(x=>setTimeout(x,1200));r=await getSpecialized(j.id)}setSpec(r)}catch(e:any){setSpec({status:'ERRO',mensagem:e.message})}finally{setSpecLoading(false)}}\n return <section className=\"case\"><div className=\"caseHero\"><div><span className=\"eyebrow\">BRIEFING DE ASSUNÇÃO</span><h2>{briefing?.numeroProcesso || 'Processo não identificado'}</h2><p>{briefing?.nomeArquivo || job.nomeArquivo}</p></div><div className=\"caseActions\"><button className=\"secondary\"><FileText size={16}/> Exportar</button><button className=\"primary\" onClick={specialized} disabled={specLoading}>{specLoading?<Loader2 className=\"spin\"/>:<Sparkles/>} Análise especializada</button></div></div>"""
          new2=""" async function specialized(){setSpecConfigOpen(true)}\n async function runSpecialized(){setSpecConfigOpen(false);setSpecLoading(true);try{const j=await startSpecialized(job.id,{...specConfig,rascunhos:specConfig.rascunhos});let r=await getSpecialized(j.id);while(!['CONCLUIDO','ERRO'].includes(r.status)){await new Promise(x=>setTimeout(x,1200));r=await getSpecialized(j.id)}setSpec(r)}catch(e:any){setSpec({status:'ERRO',mensagem:e.message})}finally{setSpecLoading(false)}}\n const toggleDraft=(value:string)=>setSpecConfig(c=>({...c,rascunhos:c.rascunhos.includes(value)?c.rascunhos.filter(x=>x!==value):[...c.rascunhos,value]}))\n return <section className=\"case\"><div className=\"caseHero\"><div><span className=\"eyebrow\">BRIEFING DE ASSUNÇÃO</span><h2>{briefing?.numeroProcesso || 'Processo não identificado'}</h2><p>{briefing?.nomeArquivo || job.nomeArquivo}</p></div><div className=\"caseActions\"><button className=\"secondary\"><FileText size={16}/> Exportar</button><button className=\"primary\" onClick={specialized} disabled={specLoading}>{specLoading?<Loader2 className=\"spin\"/>:<Sparkles/>} Análise especializada</button></div></div>\n  {specConfigOpen && <SpecializedConfigModal config={specConfig} setConfig={setSpecConfig} toggleDraft={toggleDraft} onCancel={()=>setSpecConfigOpen(false)} onSubmit={runSpecialized}/>}"""
          if old2 not in s: raise SystemExit('specialized anchor not found')
          s=s.replace(old2,new2,1)
          marker="function SpecializedPanel({spec}:{spec:any}){"
          component="""function SpecializedConfigModal({config,setConfig,toggleDraft,onCancel,onSubmit}:{config:any,setConfig:(f:any)=>void,toggleDraft:(v:string)=>void,onCancel:()=>void,onSubmit:()=>void}){\n const drafts=[['PARECER','Parecer'],['MANIFESTACAO','Manifestação'],['PETICAO','Petição'],['EMAIL_CLIENTE','E-mail ao cliente'],['RELATORIO','Relatório']]\n return <div className=\"modalBackdrop\"><div className=\"specModal\"><div className=\"specModalHeader\"><div><span className=\"eyebrow\">CONFIGURAÇÃO</span><h3>Análise especializada</h3><p>Escolha como os agentes devem trabalhar neste caso.</p></div><button className=\"iconbtn\" onClick={onCancel}><X/></button></div><div className=\"specForm\">\n  <label>Parte representada<input value={config.parteRepresentada} onChange={e=>setConfig((c:any)=>({...c,parteRepresentada:e.target.value}))} placeholder=\"Ex.: Construtora Alfa Ltda\"/></label>\n  <label>Contexto adicional<textarea value={config.contextoAdicional} onChange={e=>setConfig((c:any)=>({...c,contextoAdicional:e.target.value}))} placeholder=\"Objetivo, estratégia, informações que o advogado quer destacar...\" rows={3}/></label>\n  <div className=\"specChecks\"><label className=\"checkRow\"><input type=\"checkbox\" checked={config.forcarProcesso} onChange={e=>setConfig((c:any)=>({...c,forcarProcesso:e.target.checked}))}/><span><b>Forçar análise processual</b><small>Executa o ProcessAgent mesmo que a classificação não indique processo.</small></span></label><label className=\"checkRow\"><input type=\"checkbox\" checked={config.forcarContrato} onChange={e=>setConfig((c:any)=>({...c,forcarContrato:e.target.checked}))}/><span><b>Forçar análise contratual</b><small>Executa o ContractAgent mesmo que a classificação não indique contrato.</small></span></label></div>\n  <div><div className=\"fieldLabel\">Rascunhos desejados</div><div className=\"draftOptions\">{drafts.map(([value,label])=><label key={value} className={config.rascunhos.includes(value)?'selected':''}><input type=\"checkbox\" checked={config.rascunhos.includes(value)} onChange={()=>toggleDraft(value)}/>{label}</label>)}</div></div>\n  <label className=\"checkRow\"><input type=\"checkbox\" checked={config.pesquisaJuridica} onChange={e=>setConfig((c:any)=>({...c,pesquisaJuridica:e.target.checked}))}/><span><b>Habilitar pesquisa jurídica</b><small>Consulta somente as fontes autorizadas e rastreáveis do backend.</small></span></label>\n  {config.pesquisaJuridica && <label>Consulta de pesquisa<textarea value={config.consultaPesquisa} onChange={e=>setConfig((c:any)=>({...c,consultaPesquisa:e.target.value}))} placeholder=\"Ex.: ônus da prova em ação de cobrança CPC art. 373\" rows={2}/></label>}\n </div><div className=\"specModalFooter\"><button className=\"secondary\" onClick={onCancel}>Cancelar</button><button className=\"primary\" onClick={onSubmit}><Sparkles size={15}/> Iniciar análise</button></div></div></div>\n}\n\n"""
          if marker not in s: raise SystemExit('panel marker not found')
          s=s.replace(marker,component+marker,1)
          p.write_text(s)
          css=Path('src/styles.css')
          c=css.read_text()
          c += """\n.modalBackdrop{position:fixed;inset:0;background:#0b122066;backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}.specModal{width:min(720px,100%);max-height:90vh;overflow:auto;background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 25px 80px #0b122044}.specModalHeader{display:flex;justify-content:space-between;gap:20px;padding:22px 24px 16px;border-bottom:1px solid var(--line)}.specModalHeader h3{margin:6px 0 4px;font-size:20px}.specModalHeader p{margin:0;color:var(--muted);font-size:11px}.specForm{display:grid;gap:16px;padding:20px 24px}.specForm label:not(.checkRow){display:grid;gap:7px;font-size:10px;font-weight:800;color:#465268}.specForm input:not([type=checkbox]),.specForm textarea{width:100%;border:1px solid #dce2ea;border-radius:8px;padding:10px;font:inherit;font-size:11px;outline:none;resize:vertical}.specForm input:focus,.specForm textarea:focus{border-color:#9aadeb;box-shadow:0 0 0 3px #3157d512}.specChecks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checkRow{display:flex!important;align-items:flex-start;gap:9px;padding:11px;border:1px solid #e3e7ee;border-radius:9px;cursor:pointer}.checkRow input{margin-top:2px;accent-color:var(--blue)}.checkRow span{display:grid;gap:4px}.checkRow b{font-size:10px}.checkRow small{font-size:9px;color:#7d8898;line-height:1.4;font-weight:500}.fieldLabel{font-size:10px;font-weight:800;color:#465268;margin-bottom:8px}.draftOptions{display:flex;flex-wrap:wrap;gap:7px}.draftOptions label{display:flex!important;align-items:center;gap:6px!important;padding:8px 10px;border:1px solid #dce2ea;border-radius:99px;background:white;cursor:pointer;font-size:9px!important;font-weight:700!important;color:#56647a!important}.draftOptions label.selected{border-color:#9db1ee;background:#eff3ff;color:var(--blue)!important}.draftOptions input{accent-color:var(--blue)}.specModalFooter{display:flex;justify-content:flex-end;gap:8px;padding:15px 24px;border-top:1px solid var(--line);background:#fafbfc;border-radius:0 0 16px 16px}@media(max-width:700px){.specChecks{grid-template-columns:1fr}.specModal{max-height:94vh}}\n"""
          css.write_text(c)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css
          git commit -m "feat: configure specialized analysis before execution" || exit 0
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/implement-specialized-config.yml
          git commit -m "chore: remove one-time patch workflow"
          git push
